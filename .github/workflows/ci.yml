name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      # `npm ci`, not `npm install`. `npm install` silently repairs a lockfile that
      # disagrees with package.json, so it cannot detect the desync that blocked
      # opencode-prompts' releases for months. `npm ci` fails on it, which is the point.
      - name: Install dependencies
        run: npm ci

      - name: Validate extension structure
        run: |
          # Check required files exist
          test -f gemini-extension.json
          test -f GEMINI.md
          test -f hooks/hooks.json
          test -d node_modules/claude-prompts/dist
          test -d node_modules/claude-prompts/hooks

          echo "Extension structure validated successfully"

      - name: Validate hooks symlink target
        run: |
          # Verify hooks/lib symlink points to correct location
          test -L hooks/lib
          test -d node_modules/claude-prompts/hooks/lib

          echo "Hooks symlink validated successfully"
